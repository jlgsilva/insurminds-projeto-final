[theme]
base = "light"
primaryColor = "#15803d"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8f6"
textColor = "#0f172a"
font = "sans serif"

[server]
maxUploadSize = 50
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
toolbarMode = "minimal"
