name: ETL mensal dos microdados do Sicor

# Os microdados do BCB são atualizados mensalmente. Este fluxo reconstrói
# os conjuntos curados e abre um pull request com a atualização.
on:
  schedule:
    - cron: "0 9 5 * *"     # todo dia 5, às 9h UTC
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos a processar (separados por espaço)"
        default: "2025 2026"
      amostra:
        description: "Limite de operações por ano (vazio = tudo)"
        default: "400000"

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Executar o ETL
        run: |
          ANOS="${{ github.event.inputs.anos || '2025 2026' }}"
          AMOSTRA="${{ github.event.inputs.amostra || '400000' }}"
          PYTHONPATH=src python etl/run_etl.py --anos $ANOS --amostra $AMOSTRA

      - name: Abrir pull request com os dados curados
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "dados: atualiza conjuntos curados do Sicor"
          branch: etl/atualizacao-automatica
          title: "Atualização automática dos dados curados do Sicor"
          body: |
            Reconstrução automática dos conjuntos curados a partir dos
            microdados publicados pelo Banco Central.

            Confira o manifesto em `data/curated/manifesto.json`.
          add-paths: |
            data/curated/**
